{% extends "base.html" %}
{% block title %}Dashboard – qBit Manager{% endblock %}
{% block page_title %}Dashboard{% endblock %}

{% block extra_head %}
<style>
  #content-area { padding: 24px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  /* ── Stat cards ── */
  #stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (max-width: 639.98px)  { #stat-grid { grid-template-columns: 1fr; } }
  @media (min-width: 640px) and (max-width: 1023.98px) { #stat-grid { grid-template-columns: repeat(2, 1fr); } }

  .stat-card {
    background: var(--qbm-bg-card);
    border: 1px solid var(--qbm-border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-label { font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; color: var(--qbm-text-muted); margin-bottom: 8px; }
  .stat-value { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 1.4rem; font-weight: 600; }
  .stat-sub   { font-size: .75rem; color: var(--qbm-text-muted); margin-top: 4px; }

  /* ── Middle row ── */
  #dash-mid-row {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  @media (max-width: 1023.98px) { #dash-mid-row { grid-template-columns: 1fr; } }

  /* ── Category breakdown ── */
  .category-pill { font-size: .8rem; padding: .2em .7em; border-radius: 20px; }
</style>
{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-end mb-3">
  <button class="btn btn-sm btn-outline-secondary" id="btn-dash-refresh">
    <i class="bi bi-arrow-clockwise me-1"></i><span data-i18n="torrents.refresh"></span>
  </button>
</div>

<!-- ── Stat cards ── -->
<div id="stat-grid">
  <div class="stat-card">
    <div class="stat-label" data-i18n="dash.dl_speed"></div>
    <div class="stat-value" id="stat-dl">—</div>
    <div class="stat-sub" id="stat-dl-sub"></div>
  </div>
  <div class="stat-card">
    <div class="stat-label" data-i18n="dash.up_speed"></div>
    <div class="stat-value" id="stat-up">—</div>
    <div class="stat-sub" id="stat-up-sub"></div>
  </div>
  <div class="stat-card">
    <div class="stat-label" data-i18n="dash.total"></div>
    <div class="stat-value" id="stat-total">—</div>
    <div class="stat-sub" id="stat-total-sub"></div>
  </div>
  <div class="stat-card">
    <div class="stat-label" data-i18n="dash.disk_space"></div>
    <div class="stat-value" id="stat-disk-inline">—</div>
    <div class="progress mt-2" style="height:5px;background:var(--qbm-progress-bg);">
      <div id="stat-disk-bar" class="progress-bar" style="width:0%;border-radius:4px;background:var(--accent);"></div>
    </div>
  </div>
</div>

<!-- ── Speed chart + Disk & By state ── -->
<div id="dash-mid-row">

  <!-- Speed chart -->
  <div class="card">
    <div class="card-body">
      <div class="fw-semibold mb-3" style="font-size:.9rem;" data-i18n="dash.speed_chart"></div>
      <canvas id="speed-chart" height="100"></canvas>
    </div>
  </div>

  <!-- Disk space + By state -->
  <div class="card">
    <div class="card-body d-flex flex-column gap-4">

      <!-- Disk space -->
      <div>
        <div class="fw-semibold mb-2" style="font-size:.9rem;" data-i18n="dash.disk_space"></div>
        <div style="height:10px;border-radius:5px;background:var(--qbm-progress-bg);overflow:hidden;margin-bottom:8px;">
          <div id="stat-disk-bar2" style="height:100%;width:0%;background:var(--accent);transition:width .4s;"></div>
        </div>
        <div class="d-flex justify-content-between" style="font-size:.75rem;color:var(--qbm-text-muted);">
          <span id="disk-used-label">—</span>
          <span id="disk-free-label">—</span>
        </div>
      </div>

      <!-- By state -->
      <div>
        <div class="fw-semibold mb-2" style="font-size:.9rem;" data-i18n="dash.by_state"></div>
        <div id="by-state-body">
          <div class="text-secondary text-center py-2" style="font-size:.85rem;" data-i18n="dash.loading"></div>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- ── By category ── -->
<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-center mb-3 gap-3">
      <div class="fw-semibold" style="font-size:.9rem;" data-i18n="dash.by_category"></div>
      <div class="ms-auto d-flex gap-2" style="font-size:.8rem;">
        <button class="btn btn-sm btn-outline-secondary py-0 px-2 active" id="cat-tab-count" data-i18n="dash.total"></button>
        <button class="btn btn-sm btn-outline-secondary py-0 px-2" id="cat-tab-size" data-i18n="dash.size_by_category"></button>
      </div>
    </div>
    <div id="by-category-body">
      <div class="text-secondary text-center py-2" style="font-size:.85rem;" data-i18n="dash.loading"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function fmtSpeed(b) {
  if (!b) return '0 KB/s';
  if (b >= 1e6) return (b/1e6).toFixed(1)+' MB/s';
  if (b >= 1e3) return (b/1e3).toFixed(0)+' KB/s';
  return b+' B/s';
}
function fmtSize(b) {
  if (!b) return '—';
  if (b >= 1e12) return (b/1e12).toFixed(2)+' TB';
  if (b >= 1e9)  return (b/1e9).toFixed(2)+' GB';
  if (b >= 1e6)  return (b/1e6).toFixed(1)+' MB';
  return (b/1e3).toFixed(0)+' KB';
}

// Groupes d'états
const STATE_GROUPS = [
  { key: 'downloading', label: 'dash.downloading', states: ['downloading','forcedDL','metaDL'],                       color: '#1f6feb' },
  { key: 'seeding',     label: 'dash.seeding',     states: ['uploading','forcedUP','stalledUP'],                      color: '#3fb950' },
  { key: 'paused',      label: 'dash.paused',       states: ['pausedDL','pausedUP','stoppedDL','stoppedUP'],           color: '#8b949e' },
  { key: 'error',       label: 'dash.error',        states: ['error','missingFiles'],                                  color: '#f85149' },
  { key: 'checking',    label: 'dash.checking',     states: ['checkingDL','checkingUP','checkingResumeData'],          color: '#58a6ff' },
  { key: 'queued',      label: 'dash.queued',       states: ['queuedDL','queuedUP'],                                   color: '#d29922' },
  { key: 'other',       label: 'dash.other',        states: ['stalledDL','allocating','moving'],                       color: '#484f58' },
];

function renderByState(byState, total) {
  const el = document.getElementById('by-state-body');
  if (!total) { el.innerHTML = `<div class="text-secondary text-center py-4">${__('dash.loading')}</div>`; return; }

  el.innerHTML = STATE_GROUPS.map(g => {
    const count = g.states.reduce((s, k) => s + (byState[k] || 0), 0);
    if (!count) return '';
    const pct = Math.round(count / total * 100);
    return `
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span style="font-size:.85rem;color:var(--qbm-text);">${__(g.label)}</span>
          <span style="font-size:.82rem;color:var(--qbm-text-muted);">${count} <span style="font-size:.72rem;">(${pct}%)</span></span>
        </div>
        <div class="progress" style="height:8px;background:var(--qbm-progress-bg);">
          <div class="progress-bar" style="width:${pct}%;background:${g.color};border-radius:4px;"></div>
        </div>
      </div>`;
  }).join('');
}

let _lastByCategory     = {};
let _lastSizeByCategory = {};
let _lastTotal          = 0;
let _catMode            = 'count'; // 'count' | 'size'

function renderDiskSpace(totalSize, freeSpace) {
  const card  = document.getElementById('stat-disk-inline');
  const bar   = document.getElementById('stat-disk-bar');
  const bar2  = document.getElementById('stat-disk-bar2');
  const used  = document.getElementById('disk-used-label');
  const free  = document.getElementById('disk-free-label');

  if (freeSpace == null) {
    if (card) card.textContent = __('dash.disk_unavailable');
    return;
  }

  const estimated = totalSize + freeSpace;
  const usedPct   = estimated > 0 ? Math.round(totalSize / estimated * 100) : 0;

  if (card) card.textContent = fmtSize(totalSize);
  if (bar)  bar.style.width  = usedPct + '%';
  if (bar2) bar2.style.width = usedPct + '%';
  if (used) used.textContent = `${fmtSize(totalSize)} ${__('dash.disk_used')}`;
  if (free) free.textContent = `${fmtSize(freeSpace)} ${__('dash.disk_free')}`;
}

function renderByCategory(byCategory, total) {
  _lastByCategory = byCategory;
  _lastTotal      = total;
  if (_catMode !== 'count') return;
  const el = document.getElementById('by-category-body');
  if (!total) { el.innerHTML = `<div class="text-secondary text-center py-4">${__('dash.loading')}</div>`; return; }

  el.innerHTML = Object.entries(byCategory)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, count]) => {
      const label = cat || __('dash.no_category');
      const pct   = Math.round(count / total * 100);
      return `
        <div class="d-flex align-items-center justify-content-between mb-2">
          <span class="badge bg-secondary category-pill">${label}</span>
          <span style="font-size:.82rem;color:var(--qbm-text-muted);">${count} <span style="font-size:.72rem;">(${pct}%)</span></span>
        </div>`;
    }).join('');
}

function renderSizeByCategory(sizeByCategory) {
  _lastSizeByCategory = sizeByCategory;
  if (_catMode !== 'size') return;
  const el    = document.getElementById('by-category-body');
  const entries = Object.entries(sizeByCategory).sort((a, b) => b[1] - a[1]);
  const totalSz = entries.reduce((s, [, v]) => s + v, 0);
  if (!entries.length) { el.innerHTML = `<div class="text-secondary text-center py-4">${__('dash.loading')}</div>`; return; }

  el.innerHTML = entries.map(([cat, sz]) => {
    const label = cat || __('dash.no_category');
    const pct   = totalSz > 0 ? Math.round(sz / totalSz * 100) : 0;
    return `
      <div class="mb-3">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <span style="font-size:.85rem;color:var(--qbm-text);">${label}</span>
          <span style="font-size:.82rem;color:var(--qbm-text-muted);">${fmtSize(sz)} <span style="font-size:.72rem;">(${pct}%)</span></span>
        </div>
        <div class="progress" style="height:6px;background:var(--qbm-progress-bg);">
          <div class="progress-bar bg-info" style="width:${pct}%;border-radius:4px;"></div>
        </div>
      </div>`;
  }).join('');
}

// Onglets count / size
document.getElementById('cat-tab-count').addEventListener('click', () => {
  _catMode = 'count';
  document.getElementById('cat-tab-count').classList.add('active');
  document.getElementById('cat-tab-size').classList.remove('active');
  renderByCategory(_lastByCategory, _lastTotal);
});
document.getElementById('cat-tab-size').addEventListener('click', () => {
  _catMode = 'size';
  document.getElementById('cat-tab-size').classList.add('active');
  document.getElementById('cat-tab-count').classList.remove('active');
  renderSizeByCategory(_lastSizeByCategory);
});

// ── Speed chart ──────────────────────────────────────────────────────────────
const MAX_HISTORY = 20;
const SPEED_STORAGE_KEY = 'qbm-speed-history';
const SPEED_MAX_AGE_MS  = 5 * 60 * 1000; // 5 minutes

function _loadSpeedHistory() {
  try {
    const raw = localStorage.getItem(SPEED_STORAGE_KEY);
    if (!raw) return { labels: [], dl: [], up: [] };
    const { labels, dl, up, ts } = JSON.parse(raw);
    // Ignorer si les données ont plus de 5 minutes (session trop ancienne)
    if (!ts || Date.now() - ts > SPEED_MAX_AGE_MS) return { labels: [], dl: [], up: [] };
    return { labels: labels || [], dl: dl || [], up: up || [] };
  } catch { return { labels: [], dl: [], up: [] }; }
}

function _saveSpeedHistory() {
  try {
    localStorage.setItem(SPEED_STORAGE_KEY, JSON.stringify({
      labels: speedLabels, dl: speedDL, up: speedUP, ts: Date.now(),
    }));
  } catch {}
}

const _hist = _loadSpeedHistory();
const speedLabels = _hist.labels, speedDL = _hist.dl, speedUP = _hist.up;

function getCSSVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

const speedChart = new Chart(document.getElementById('speed-chart').getContext('2d'), {
  type: 'line',
  data: {
    labels: speedLabels,
    datasets: [
      {
        label: __('dash.dl_speed'),
        data: speedDL,
        borderColor: '#1f6feb',
        backgroundColor: 'rgba(31,111,235,.15)',
        fill: true, tension: 0.4, pointRadius: 3, borderWidth: 2,
      },
      {
        label: __('dash.up_speed'),
        data: speedUP,
        borderColor: '#3fb950',
        backgroundColor: 'rgba(63,185,80,.15)',
        fill: true, tension: 0.4, pointRadius: 3, borderWidth: 2,
      },
    ],
  },
  options: {
    responsive: true,
    animation: { duration: 300 },
    scales: {
      x: { ticks: { color: getCSSVar('--qbm-text-muted'), maxRotation: 0, maxTicksLimit: 8 }, grid: { color: getCSSVar('--qbm-border') } },
      y: { ticks: { color: getCSSVar('--qbm-text-muted'), callback: v => fmtSpeed(v) }, grid: { color: getCSSVar('--qbm-border') }, beginAtZero: true },
    },
    plugins: {
      legend: { labels: { color: getCSSVar('--qbm-text') } },
      tooltip: { callbacks: { label: ctx => `${ctx.dataset.label}: ${fmtSpeed(ctx.raw)}` } },
    },
  },
});

function updateChartTheme() {
  const textMuted = getCSSVar('--qbm-text-muted');
  const border    = getCSSVar('--qbm-border');
  const text      = getCSSVar('--qbm-text');
  speedChart.options.scales.x.ticks.color = textMuted;
  speedChart.options.scales.x.grid.color  = border;
  speedChart.options.scales.y.ticks.color = textMuted;
  speedChart.options.scales.y.grid.color  = border;
  speedChart.options.plugins.legend.labels.color = text;
  speedChart.update();
}

document.addEventListener('qbm-theme-changed', updateChartTheme);

function updateSpeedChart(dl, up) {
  const label = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  speedLabels.push(label); speedDL.push(dl); speedUP.push(up);
  if (speedLabels.length > MAX_HISTORY) { speedLabels.shift(); speedDL.shift(); speedUP.shift(); }
  speedChart.update();
  _saveSpeedHistory();
}

function loadDashboard() {
  fetch('/api/dashboard')
    .then(r => r.json())
    .then(d => {
      document.getElementById('stat-total').textContent = d.total ?? '—';
      document.getElementById('stat-dl').textContent    = fmtSpeed(d.dl_speed);
      document.getElementById('stat-up').textContent    = fmtSpeed(d.up_speed);
      const dlSub = document.getElementById('stat-dl-sub');
      const upSub = document.getElementById('stat-up-sub');
      const totSub = document.getElementById('stat-total-sub');
      const byState = d.by_state || {};
      const dlCount = (byState.downloading || 0) + (byState.forcedDL || 0) + (byState.metaDL || 0);
      const upCount = (byState.uploading || 0) + (byState.forcedUP || 0) + (byState.stalledUP || 0);
      if (dlSub)  dlSub.textContent  = dlCount  + ' ' + __('dash.downloading').toLowerCase();
      if (upSub)  upSub.textContent  = upCount  + ' ' + __('dash.seeding').toLowerCase();
      if (totSub) totSub.textContent = (d.total ?? 0) + ' torrents';
      renderDiskSpace(d.total_size || 0, d.free_space ?? null);
      renderByState(d.by_state || {}, d.total);
      renderByCategory(d.by_category || {}, d.total);
      renderSizeByCategory(d.size_by_category || {});
      updateSpeedChart(d.dl_speed || 0, d.up_speed || 0);
    })
    .catch(() => showToast(__('toast.failed_load') + 'dashboard', 'danger'));
}

document.getElementById('btn-dash-refresh').addEventListener('click', loadDashboard);

// Auto-refresh toutes les 15 secondes
loadDashboard();
setInterval(loadDashboard, 15000);
</script>
{% endblock %}
